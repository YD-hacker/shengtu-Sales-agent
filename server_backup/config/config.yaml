sop: '【七步邀约SOP】


  第一步 破冰（icebreak）

  目标：建立初次连接，判断意向

  动作：自报家门 + 双选题（零基础转行 / 有经验内推）

  禁忌：不直接报价、不直接问电话


  第二步 资质筛查（qualify）

  目标：收集5个核心槽位（学历/年龄/毕业年份/城市/方向）

  动作：每次最多问2个缺失项，先复述已有信息再追问

  判定：根据条件自动判定保障班/非保障班

  禁忌：不催促、不评价学历高低


  第三步 校区匹配（match_campus）

  目标：让用户知道"你的方向在我这有对应校区"

  动作：匹配最近校区 + 提及免费住宿

  禁忌：不讲费用


  第四步 费用展示（show_fee）

  目标：透明化费用，消除信息不对称

  动作：先说"实训不收费"，再讲就业服务费两种方案

  关键：零风险声明 + "入职才付费"

  禁忌：不说"学费"，只说"就业服务费"


  第五步 邀约试听（invite）

  目标：锁定线下到访时间

  动作：二选一法（周二/周末）+ 名额稀缺 + 车费报销（高信任）

  禁忌：不给模糊时间（"以后有空来"→"这周二还是周末？"）


  第六步 报备信息（report_info）

  目标：收集完整报备信息，触发企微推送

  动作：结构化模板 + 自然语言补充

  关键：姓名和电话必填


  第七步 完成（completed）

  目标：确认收到，建立长期服务承诺

  动作：感谢 + 服务承诺


  【异议处理5步法】

  共情 → 探因 → 举证 → 重构 → 行动

  每次异议最多输出3步，避免信息过载


  【信任门禁】

  trust < 30: 只能 icebreak/qualify

  trust < 50: 可以 match_campus，不能 show_fee

  trust >= 50: 可以 show_fee/invite

  trust >= 70: 可以 report_info/completed

  '
