scripts:
  # ============================
  # 破冰话术
  # ============================
  icebreak_normal:
    - "你好，我是小苏，做IT人才服务6年了。讲真的，我见过太多人想转行但不知道怎么开始——你是想零基础学门技术，还是已经有经验想直接内推？"
  icebreak_greet:
    - "你好呀，我是小苏，做IT人才服务6年了。你是想零基础转行学门技术，还是有经验想直接内推？"

  # ============================
  # 收费展示 — 保障班
  # ============================
  fee_show_core:
    - "钱的事我一次讲清楚：实训期间一分钱不收，住宿也免费。等你入职拿到工资了，才开始收就业服务费。两种方式：一次性19600，或者分期——前两个月每月1毛钱，第三个月起每月3600，一共7期，总共25200块零2毛。这不是借贷，不影响征信，合同白纸黑字写着。"

  # ============================
  # 收费展示 — 非保障班
  # ============================
  fee_show_non_guarantee:
    - "非保障班简单，整个实训全程1万4左右，没额外费用，住宿也包。学完后有就业辅导，但不签最低薪资协议。你想想看，能接受就过来了解下。"

  # ============================
  # 不合格提示
  # ============================
  reject_qualify:
    - "跟你讲实话，咱正式就业班有学历红线，你这个情况暂时走不了内推保障。不过你可以报非保障技能班，费用1万4左右，学完也能帮你推岗位，就是不签薪资协议。你看要了解下吗？"

  # ============================
  # 异议话术（5步法）
  # ============================
  objection_consider:
    - "确实，转行是大事，犹豫很正常。上个月有个广州的学员，32岁从工厂出来，现在在网安岗位月薪9500。这周末你先来试听一天，住宿我安排，听完再决定？"
  objection_learn:
    - "怕学不会我理解。讲真的，咱这边有零基础4个月转行的，从打字速度开始教，一步一步来。学不会不收钱，你有什么好怕的？先来试听一节课看看难度？"
  objection_time:
    - "忙，说明你在努力生活，我尊重你。但你想想看，忙一阵子换以后轻松，还是忙一辈子？咱有白天班晚班，先来校区看半小时，我给你看下时间安排。"
  objection_distance:
    - "距离远确实麻烦，我理解。但远是暂时的，职业是长期的。实训住宿全免费，我给你安排最近的校区，拎包入住就行。"
  objection_institution:
    - "你警惕性高，好事——说明你在认真考虑。我们是做IT内推实训的基地，直接跟企业合作定向输送。不就业不收费，合同白纸黑字。周末来校区看看，跟在学的学员聊几句就清楚了。"
  objection_price:
    - "钱的事要算清楚，不跟你绕弯子。这不是学费，是就业服务费——你入职拿到工资了才付。不是你花19600买一份工作，是你先拿到工作再付钱。哪个风险大？费用细节来校区我给你看合同，一目了然。"

  # ============================
  # 默认兜底
  # ============================
  default:
    - "这个我不瞎承诺，合同里都写得明明白白。你周末来校区我当面给你讲清楚。"

  # ============================
  # 已完成
  # ============================
  completed:
    - "你的信息我都收到了，我们会尽快安排。有什么问题随时找我，小苏一直都在。"

  # ============================
  # 主动告知风险（建信任用）
  # ============================
  risk_disclosure:
    - "跟你讲实话，这个班不是所有人都适合——学历和年龄有硬性要求，不达标我真没法帮你走保障班。但我先帮你看看条件，行不行咱都明说。"

  # ============================
  # 长期关系管理
  # ============================
  post_sale_thankyou:
    - "欢迎加入！你的实训安排我会全程跟进，有问题随时找我，小苏一直都在。"
  post_sale_checkin:
    - "实训一周了，感觉怎么样？有什么不适应的跟我说，我帮你协调。"
  weekly_info:
    - "分享个行业资讯——最近网安岗位需求又涨了15%，特别是等保合规方向。你有兴趣可以了解下。"

  # ============================
  # 周五问候
  # ============================
  friday_greeting:
    - "周末愉快！下周有什么计划可以跟我说。"

  # ============================
  # 痛点共情话术
  # ============================
  pain_empathy:
    age_too_old: "年纪大不是问题，讲真的，我见过35岁转行的，现在在深圳拿1万5。关键是你愿不愿意迈出这一步。"
    factory_worker: "在厂里干久了确实看不到头，咱这边有从流水线转过来做网安的，现在日子比以前好太多。"
    low_end_job: "送外卖跑滴滴辛苦还不稳定，咱这边学了技术，坐办公室吹空调拿工资，不用风吹日晒。"
    no_future: "看不到希望的时候最难受，我能理解。但你愿意了解，说明你还没放弃，这已经是第一步了。"
    fear_change: "怕学不会很正常，谁第一次接触新东西不害怕？咱这边零基础从打字开始教，一步一步来。"
    layoff: "被裁确实难受，但你想想看，这也许是推你一把的机会。趁这个时间学门手艺，比再找个随时可能裁人的活强。"
    unwilling: "不甘心就对了一半——剩下一半就是行动。咱不就业不收费，你零风险试一试，不好随时走。"

  # ============================
  # 拉回话术（按状态）
  # ============================
  pullback:
    icebreak: "咱先把正事聊了——你是想零基础转行，还是有经验想内推？"
    qualify: "咱先把基础条件确认下——学历和年龄方便说吗？"
    match_campus: "你这个问题来校区当面问更清楚——先看下离你最近的校区？"
    show_fee: "这些合同里都写着，来校区我拿给你看——咱先把费用的事说清楚？"
    invite: "这些细节你来了我一条条给你讲——这周二来试听？"
    report_info: "这些事面谈更靠谱——先把报备信息填了，我给你安排？"
    reject_qualify: "具体适不适合你来校区评估更准——先了解下非保障班？"

  # ============================
  # 信任修复话术
  # ============================
  trust_repair_show_fee: "不跟你扯虚的，这个班不是所有人都适合——我先帮你看看条件过不过关，再聊后面的事，行吧？"
  trust_repair_report: "咱聊到这一步了，我再多说一句：过来试听一天，住宿我安排，你亲眼看了再决定，比我在这里说一百句都强。"
