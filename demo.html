<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盛途Sales Agent 演示</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: #f0f2f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .header h1 { font-size: 18px; font-weight: 600; }
        .header .status {
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 12px;
            background: rgba(255,255,255,0.2);
        }
        .header .status.ok { background: rgba(76,175,80,0.3); }
        .header .status.error { background: rgba(244,67,54,0.3); }
        .main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }
        .sidebar {
            width: 280px;
            background: white;
            border-right: 1px solid #e8e8e8;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        .sidebar h3 {
            padding: 16px;
            font-size: 14px;
            color: #666;
            border-bottom: 1px solid #f0f0f0;
        }
        .scenario-btn {
            display: block;
            width: 100%;
            padding: 12px 16px;
            border: none;
            background: white;
            text-align: left;
            cursor: pointer;
            font-size: 14px;
            color: #333;
            border-bottom: 1px solid #f5f5f5;
            transition: background 0.2s;
        }
        .scenario-btn:hover { background: #f5f5ff; }
        .scenario-btn .label {
            display: block;
            font-weight: 500;
            margin-bottom: 4px;
        }
        .scenario-btn .desc {
            display: block;
            font-size: 12px;
            color: #999;
        }
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f0f2f5;
        }
        .msg {
            margin-bottom: 16px;
            display: flex;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .msg.user { justify-content: flex-end; }
        .msg .bubble {
            max-width: 70%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            word-break: break-word;
        }
        .msg.user .bubble {
            background: #95ec69;
            color: #333;
            border-bottom-right-radius: 4px;
        }
        .msg.agent .bubble {
            background: white;
            color: #333;
            border-bottom-left-radius: 4px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        .msg.agent .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
            margin-right: 10px;
            flex-shrink: 0;
        }
        .msg.system {
            justify-content: center;
        }
        .msg.system .bubble {
            background: rgba(0,0,0,0.05);
            color: #999;
            font-size: 12px;
            padding: 6px 16px;
            border-radius: 16px;
        }
        .input-area {
            padding: 16px 20px;
            background: white;
            border-top: 1px solid #e8e8e8;
            display: flex;
            gap: 12px;
        }
        .input-area input {
            flex: 1;
            padding: 10px 16px;
            border: 1px solid #d9d9d9;
            border-radius: 20px;
            font-size: 14px;
            outline: none;
            transition: border 0.2s;
        }
        .input-area input:focus { border-color: #667eea; }
        .input-area button {
            padding: 10px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .input-area button:hover { opacity: 0.9; }
        .input-area button:disabled { opacity: 0.5; cursor: not-allowed; }
        .info-panel {
            width: 300px;
            background: white;
            border-left: 1px solid #e8e8e8;
            padding: 16px;
            overflow-y: auto;
        }
        .info-panel h3 {
            font-size: 14px;
            color: #666;
            margin-bottom: 12px;
        }
        .info-item {
            padding: 8px 0;
            border-bottom: 1px solid #f5f5f5;
            font-size: 13px;
        }
        .info-item .label { color: #999; }
        .info-item .value { color: #333; font-weight: 500; }
        .typing {
            display: none;
            padding: 10px 14px;
            background: white;
            border-radius: 12px;
            border-bottom-left-radius: 4px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            font-size: 14px;
            color: #999;
        }
        .typing.show { display: inline-block; }
        .typing span {
            animation: blink 1.4s infinite;
        }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink {
            0%, 60%, 100% { opacity: 0; }
            30% { opacity: 1; }
        }
        .config-bar {
            padding: 12px 16px;
            background: #fafafa;
            border-bottom: 1px solid #e8e8e8;
            display: flex;
            gap: 12px;
            align-items: center;
            font-size: 13px;
        }
        .config-bar input {
            padding: 4px 10px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            font-size: 13px;
            width: 200px;
        }
        .config-bar button {
            padding: 4px 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>盛途Sales Agent 演示</h1>
        <span class="status" id="status">检查中...</span>
    </div>
    <div class="config-bar">
        <span>服务器:</span>
        <input type="text" id="serverUrl" value="http://49.235.130.224:8080" placeholder="服务器地址">
        <span>Token:</span>
        <input type="text" id="apiToken" value="your-api-key" placeholder="API Token" style="width:250px">
        <button onclick="checkHealth()">连接测试</button>
    </div>
    <div class="main">
        <div class="sidebar">
            <h3>预设场景</h3>
            <button class="scenario-btn" onclick="runScenario('normal')">
                <span class="label">场景1：正常咨询</span>
                <span class="desc">破冰→资质→校区→费用→邀约</span>
            </button>
            <button class="scenario-btn" onclick="runScenario('objection')">
                <span class="label">场景2：异议处理</span>
                <span class="desc">犹豫→嫌贵→嫌远</span>
            </button>
            <button class="scenario-btn" onclick="runScenario('insult')">
                <span class="label">场景3：辱骂处理</span>
                <span class="desc">脏话辱骂→安抚/转人工</span>
            </button>
            <button class="scenario-btn" onclick="runScenario('correct')">
                <span class="label">场景4：信息纠正</span>
                <span class="desc">学历纠正→重新判定</span>
            </button>
            <button class="scenario-btn" onclick="runScenario('refund')">
                <span class="label">场景5：退费咨询</span>
                <span class="desc">退费政策→合规应答</span>
            </button>
            <button class="scenario-btn" onclick="runScenario('competitor')">
                <span class="label">场景6：竞品对比</span>
                <span class="desc">达内对比→差异化回答</span>
            </button>
            <h3>快捷操作</h3>
            <button class="scenario-btn" onclick="clearChat()">
                <span class="label">清空对话</span>
                <span class="desc">重新开始</span>
            </button>
            <button class="scenario-btn" onclick="showScore()">
                <span class="label">查看线索分</span>
                <span class="desc">当前用户评分</span>
            </button>
            <button class="scenario-btn" onclick="showProfile()">
                <span class="label">查看用户画像</span>
                <span class="desc">深度画像分析</span>
            </button>
        </div>
        <div class="chat-area">
            <div class="messages" id="messages"></div>
            <div class="input-area">
                <input type="text" id="userInput" placeholder="输入消息..." onkeydown="if(event.key==='Enter')sendMessage()">
                <button id="sendBtn" onclick="sendMessage()">发送</button>
            </div>
        </div>
        <div class="info-panel" id="infoPanel">
            <h3>用户信息</h3>
            <div class="info-item">
                <span class="label">用户ID: </span>
                <span class="value" id="infoUserId">-</span>
            </div>
            <div class="info-item">
                <span class="label">线索分: </span>
                <span class="value" id="infoScore">-</span>
            </div>
            <div class="info-item">
                <span class="label">线索等级: </span>
                <span class="value" id="infoGrade">-</span>
            </div>
            <div class="info-item">
                <span class="label">对话阶段: </span>
                <span class="value" id="infoNode">-</span>
            </div>
            <div class="info-item">
                <span class="label">信任度: </span>
                <span class="value" id="infoTrust">-</span>
            </div>
            <h3 style="margin-top:16px">对话统计</h3>
            <div class="info-item">
                <span class="label">消息轮次: </span>
                <span class="value" id="infoRounds">0</span>
            </div>
            <div class="info-item">
                <span class="label">检测意图: </span>
                <span class="value" id="infoIntent">-</span>
            </div>
        </div>
    </div>

    <script>
        let userId = 'demo_' + Date.now();
        let roundCount = 0;
        let isProcessing = false;

        function getServer() {
            return document.getElementById('serverUrl').value.replace(/\/+$/, '');
        }

        function getToken() {
            return document.getElementById('apiToken').value;
        }

        function addMessage(role, text) {
            const messages = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = 'msg ' + role;

            if (role === 'agent') {
                div.innerHTML = `
                    <div class="avatar">范</div>
                    <div class="bubble">${text.replace(/\n/g, '<br>')}</div>
                `;
            } else if (role === 'system') {
                div.innerHTML = `<div class="bubble">${text}</div>`;
            } else {
                div.innerHTML = `<div class="bubble">${text}</div>`;
            }

            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }

        function addTyping() {
            const messages = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = 'msg agent';
            div.id = 'typingMsg';
            div.innerHTML = `
                <div class="avatar">范</div>
                <div class="typing show"><span>●</span><span>●</span><span>●</span></div>
            `;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }

        function removeTyping() {
            const el = document.getElementById('typingMsg');
            if (el) el.remove();
        }

        async function checkHealth() {
            const statusEl = document.getElementById('status');
            statusEl.textContent = '检查中...';
            statusEl.className = 'status';
            try {
                const resp = await fetch(getServer() + '/health');
                const data = await resp.json();
                if (data.status === 'ok') {
                    statusEl.textContent = `已连接 | LLM: ${data.llm} | 用户: ${data.user_count}`;
                    statusEl.className = 'status ok';
                } else {
                    statusEl.textContent = '异常: ' + data.status;
                    statusEl.className = 'status error';
                }
            } catch (e) {
                statusEl.textContent = '连接失败: ' + e.message;
                statusEl.className = 'status error';
            }
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const msg = input.value.trim();
            if (!msg || isProcessing) return;

            input.value = '';
            addMessage('user', msg);
            roundCount++;
            document.getElementById('infoRounds').textContent = roundCount;

            isProcessing = true;
            document.getElementById('sendBtn').disabled = true;
            addTyping();

            try {
                const resp = await fetch(getServer() + '/test/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + getToken()
                    },
                    body: JSON.stringify({ user_id: userId, msg: msg, stream: true })
                });

                const reader = resp.body.getReader();
                const decoder = new TextDecoder();
                let reply = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n');
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = line.substring(6).trim();
                            if (data === '[DONE]') break;
                            if (data) reply += data;
                        }
                    }
                }

                removeTyping();
                if (reply) {
                    addMessage('agent', reply);
                }
            } catch (e) {
                removeTyping();
                addMessage('system', '请求失败: ' + e.message);
            }

            isProcessing = false;
            document.getElementById('sendBtn').disabled = false;
            input.focus();

            // 异步更新用户信息
            setTimeout(() => updateUserInfo(), 500);
        }

        async function updateUserInfo() {
            try {
                const resp = await fetch(getServer() + '/api/user/' + userId + '/score', {
                    headers: { 'Authorization': 'Bearer ' + getToken() }
                });
                const data = await resp.json();
                if (data.lead_score !== undefined) {
                    document.getElementById('infoScore').textContent = data.lead_score;
                    document.getElementById('infoGrade').textContent = data.lead_grade || '-';
                    document.getElementById('infoNode').textContent = data.current_node || '-';
                    document.getElementById('infoTrust').textContent = data.trust_level || '-';
                }
            } catch (e) {}
        }

        async function showScore() {
            addMessage('system', '正在查询线索分...');
            try {
                const resp = await fetch(getServer() + '/api/user/' + userId + '/score', {
                    headers: { 'Authorization': 'Bearer ' + getToken() }
                });
                const data = await resp.json();
                addMessage('system', `线索分: ${data.lead_score || '-'} | 等级: ${data.lead_grade || '-'} | 阶段: ${data.current_node || '-'} | 信任: ${data.trust_level || '-'}`);
            } catch (e) {
                addMessage('system', '查询失败: ' + e.message);
            }
        }

        async function showProfile() {
            addMessage('system', '正在查询用户画像...');
            try {
                const resp = await fetch(getServer() + '/api/user/' + userId + '/profile', {
                    headers: { 'Authorization': 'Bearer ' + getToken() }
                });
                const data = await resp.json();
                const profile = data.profile || {};
                const strategies = data.strategies || {};
                const lines = [];
                if (strategies.decision_style) lines.push(`决策风格: ${strategies.decision_style}`);
                if (strategies.communication_style) lines.push(`沟通风格: ${strategies.communication_style}`);
                if (strategies.economic_pressure) lines.push(`经济压力: ${strategies.economic_pressure}`);
                addMessage('system', lines.join(' | ') || '暂无画像数据');
            } catch (e) {
                addMessage('system', '查询失败: ' + e.message);
            }
        }

        function clearChat() {
            userId = 'demo_' + Date.now();
            roundCount = 0;
            document.getElementById('messages').innerHTML = '';
            document.getElementById('infoUserId').textContent = userId;
            document.getElementById('infoScore').textContent = '-';
            document.getElementById('infoGrade').textContent = '-';
            document.getElementById('infoNode').textContent = '-';
            document.getElementById('infoTrust').textContent = '-';
            document.getElementById('infoRounds').textContent = '0';
            document.getElementById('infoIntent').textContent = '-';
            addMessage('system', '对话已清空，新用户ID: ' + userId);
        }

        const scenarios = {
            normal: [
                '你好',
                '我是大专毕业，在广州，25岁',
                '2022年毕业的，想学网安',
                '多少钱啊',
                '好的，什么时候可以去看看'
            ],
            objection: [
                '你好',
                '本科，28岁，深圳',
                '2020年毕业，大数据方向',
                '我再想想吧',
                '太贵了，能不能便宜点',
                '太远了不方便过去'
            ],
            insult: [
                '你好',
                '滚蛋，骗子'
            ],
            correct: [
                '你好',
                '我是本科，25岁，广州',
                '不对，我说错了，我是大专',
                '2023年毕业的，想学网安'
            ],
            refund: [
                '你好',
                '大专，26岁，广州',
                '2021年毕业，网安方向',
                '如果找不到工作怎么退费？'
            ],
            competitor: [
                '你好',
                '本科，24岁，深圳',
                '2024年毕业，大数据',
                '达内和你们有什么区别？'
            ]
        };

        async function runScenario(name) {
            const msgs = scenarios[name];
            if (!msgs) return;

            clearChat();
            addMessage('system', `运行场景: ${name}`);

            for (const msg of msgs) {
                document.getElementById('userInput').value = msg;
                await sendMessage();
                await new Promise(r => setTimeout(r, 1000));
            }
        }

        // 初始化
        document.getElementById('infoUserId').textContent = userId;
        checkHealth();
        document.getElementById('userInput').focus();
    </script>
</body>
</html>
