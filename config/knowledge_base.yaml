scripts:
  # ============================
  # 破冰话术
  # ============================
  icebreak_normal:
    - "你好，我是小范，做IT人才服务6年了。讲真的，我见过太多人想转行但不知道怎么开始——你是想零基础学门技术，还是已经有经验想直接内推？"
    - "嗨，小范，做IT人才这块6年了。你是想转行学技术，还是有经验想找个更好的机会？"
    - "你好呀，我是小范。你是想零基础转行，还是已经有经验想内推？先聊聊你的情况。"
  icebreak_greet:
    - "你好呀，我是小范，做IT人才服务6年了。你是想零基础转行学门技术，还是有经验想直接内推？"
    - "嗨，小范~ 你是想转行学技术，还是有经验想跳槽？"
    - "你好呀，我是小范，专做网安和大数据方向的人才服务。你是什么情况？"

  # ============================
  # 收费展示 — 保障班
  # ============================
  fee_show_core:
    - "钱的事我一次讲清楚：实训期间一分钱不收，住宿也免费。等你入职拿到工资了，才开始收就业服务费。两种方式：一次性19600，或者分期——前两个月每月1毛钱，第三个月起每月3600，一共7期，总共25200块零2毛。如果第3个月你还在学习或推进就业中，分期会自动顺延，等你正式拿到offer才开始算。这不是借贷，不影响征信。跟你说个底——最坏的情况，如果60个工作日内我们没能帮你就业，就业服务费一分不收，你只需要付学杂费，10块钱一天。一个半月也就四五百块钱，这个风险我们替你扛了。你想想看，你入职后一个半月工资就回本了，后面全是净赚。合同白纸黑字写着，来校区我给你逐条看。"

  # ============================
  # 收费展示 — 非保障班
  # ============================
  fee_show_non_guarantee:
    - "非保障班简单，整个实训全程1万4左右，没额外费用，住宿也包。学完后有就业辅导，但不签最低薪资协议。你想想看，能接受就过来了解下。"

  # ============================
  # 不合格提示
  # ============================
  reject_qualify:
    - "跟你讲实话，咱正式就业班有学历红线，你这个情况暂时走不了内推保障。不过你可以报非保障技能班，费用1万4左右，学完也能帮你推岗位，就是不签薪资协议。你看要了解下吗？"

  # ============================
  # 异议话术 — 5步法增强版
  # 融合面试官实战技巧：共情→探因→举证→重构→行动
  # ============================
  objection_consider:
    - "确实，转行是大事，犹豫很正常。不过我跟你说个数据——现在网安人才缺口268万，大数据缺口150万，企业不是招不招人的问题，是根本找不到人。上个月有个广州的学员，32岁从工厂出来，现在网安月薪9500。犹豫的成本比试错高——再等一年，年龄大了一岁，机会少了一分。这周末先来试听一天，住宿我安排，听完再决定？"

  objection_learn:
    - "怕学不会我理解，谁第一次接触新东西不害怕？但我跟你说实话，这个岗位70%是工具使用——就像学Excel、学开车，不是让你写代码。咱这边零基础从打字速度开始教，一步一步来。大学一学期才100来节专业课，我们一天10节课，一个半月顶大学一年。而且学不会不收钱，你有什么好怕的？先来试听一节课，看看难度到底怎么样，你自己判断。"

  objection_time:
    - "忙，说明你在努力生活，我尊重你。但你想想看——忙一阵子换以后轻松，还是忙一辈子？你现在的工作，忙了这么多年薪资涨了多少？咱这边有白天班和晚班，前两周还能远程跟。一个半月的时间投资，换一个未来十年不愁的饭碗，你觉得值不值？先来校区看半小时，我给你看下时间安排表。"

  objection_distance:
    - "距离远确实麻烦，我理解。但远是暂时的，职业是长期的。一个半月换一个一辈子的技术傍身，这个路费和时间花得值不值？咱广州杭州都有校区，实训期间住宿全免费，拎包入住。你只需要人过来，其他我安排。而且就业不只这两个城市——深圳、上海、北京、广州、杭州都可以推荐，学完你未必留在这。"

  objection_institution:
    - "你警惕性高，好事——说明你在认真考虑。我跟你说实话，我们不是培训机构，我们是猎聘公司。培训机构卖你课程，我们卖你工作——区别在哪？你就业了拿到工资了，我们才收就业服务费。你没就业，我们一分钱不收。哪个培训机构敢这么干？我们的钱，是企业付的人才推荐费，不是你付的学费。周末来校区看看，跟在学的学员聊几句，真不真你自己判断。营业执照、办学资质、实训环境全都是公开的。"

  objection_price:
    - "钱的事要算清楚，不跟你绕弯子。第一，这不是学费，是就业服务费——你入职拿到工资了才付。不是你花19600买一份工作，是你先拿到工作再付钱。第二，你算笔账：你现在月薪多少？入职后最低9000到10000起步，一年多挣多少？一个半月工资就覆盖全部费用了。第三，分期前两个月每月才1毛钱，第3个月你已经在上班拿工资了。哪个风险大？费用细节来校区我给你看合同，一目了然。"

  # ============================
  # 默认兜底
  # ============================
  default:
    - "这个我不瞎承诺，合同里都写得明明白白。你周末来校区我当面给你讲清楚。"

  # ============================
  # 已完成
  # ============================
  completed:
    - "收到，我这边帮你安排，有消息第一时间跟你说。有什么问题随时找我，我一直都在。"
    - "信息我收到了，我帮你对接，后面有什么进展我直接跟你说。"
    - "好的，都记下了。我这边帮你安排，你等我消息就行。"

  # ============================
  # 主动告知风险（建信任用）
  # ============================
  risk_disclosure:
    - "跟你讲实话，这个班不是所有人都适合——学历和年龄有硬性要求，不达标我真没法帮你走保障班。但我先帮你看看条件，行不行咱都明说。我不靠忽悠人赚钱，你合适我推你，不合适我直说，不浪费彼此时间。"

  # ============================
  # 长期关系管理
  # ============================
  post_sale_thankyou:
    - "欢迎加入！你的实训安排我会全程跟进，有问题随时找我，小范一直都在。"
  post_sale_checkin:
    - "实训一周了，感觉怎么样？有什么不适应的跟我说，我帮你协调。"
  weekly_info:
    - "分享个行业资讯——最近网安岗位需求又涨了15%，特别是等保合规方向。你有兴趣可以了解下。"

  # ============================
  # 周五问候
  # ============================
  friday_greeting:
    - "周末愉快！下周有什么计划可以跟我说。"

  # ============================
  # 痛点共情话术（增强版）
  # ============================
  pain_empathy:
    age_too_old: "年纪大不是问题，讲真的，我见过35岁从工厂出来转行的，现在在深圳做网安拿1万5。企业看的是你能不能干活，不是你多大了。关键是你愿不愿意迈出这一步。"
    factory_worker: "在厂里干久了确实看不到头——每天重复一样的动作，薪资天花板就在那。咱这边有从流水线转过来的，现在坐办公室做安全运维，日子比以前好太多。你的学历条件完全够，就差这一步。"
    low_end_job: "送外卖跑滴滴辛苦还不稳定——风里来雨里去，还没有五险一金。咱这边学了技术，坐办公室吹空调拿工资，五险一金双休全配齐。同样是付出，回报差太多了。"
    no_future: "看不到希望的时候最难受，我能理解。但你愿意了解，说明你还没放弃，这已经是第一步了。其实你不是能力不行，是你现在这行本身就没有上升空间——换个赛道，你的学历和学习能力完全够用。"
    fear_change: "怕学不会很正常，谁第一次接触新东西不害怕？但你想一下——你当年学开车、学用智能手机，一开始也觉得难，现在不都顺手了？技术岗入门没你想的那么难，70%是工具使用，跟学Excel一样。"
    layoff: "被裁确实难受，但说句不好听的——这说明你原来的岗位本身就不稳定。与其再找一个随时可能裁人的活，不如趁这个空窗期学门硬技术。一个半月后，你不是去找工作，是工作来找你。"
    unwilling: "不甘心就对了一半——剩下一半就是行动。你既然不想一辈子这样，那就给自己一个半月试试。咱不就业不收费，你零风险试一试，不好随时走。最坏的结果也就是回到原点，但万一成了呢？"

  # ============================
  # 拉回话术（按状态）
  # ============================
  pullback:
    icebreak: "先说说你的情况呗——你是想转行学技术，还是有经验想找个好机会？"
    qualify: "咱先聊正事——学历和年龄方便说下吗？"
    match_campus: "这个你来了我当面给你讲更清楚——先看看你离哪个校区近？"
    show_fee: "合同上都写着呢，你来了我拿给你看——费用这块我先跟你说明白？"
    invite: "这些细节你来了我一条条跟你说——这周二还是周末方便过来？"
    report_info: "这个见了面聊更靠谱——你先把名字和电话发我，我帮你登记下？"
    reject_qualify: "合不合适你来试一天就知道了——要不先了解下非保障班？"

  # ============================
  # 信任修复话术
  # ============================
  trust_repair_show_fee: "不跟你扯虚的，这个班不是所有人都适合——我先帮你看看条件过不过关，再聊后面的事，行吧？"
  trust_repair_report: "这样，你过来试听一天，住宿我安排。你亲眼看了再决定，比我说一百句都强。"

  # ============================
  # 行业前景数据（新建信任/岗位种草用）
  # 来源：电销话术中经核实的行业数据
  # ============================
  industry_prospects:
    网安: "网络安全这个行业，目前全国人才缺口268万，从业人员才32万——相当于有268万个岗位没人做。全国792所大学刚开这个专业，毕业生根本不够用。国家「十四五」重点扶持，2025年要实现网络安全自主可控，市场规模1.5万亿。现在入行就是红利期——就像十年前学Java开发那批人，现在都是架构师了。"
    大数据: "大数据这个行业，全国人才缺口150万，从业人员才三四十万。全国740所大学新增大数据专业，但最早一批毕业生也才刚出来，企业根本等不及。国家提出2025年要实现数字化中国，市场规模2万亿。人社局还给大数据人才出台补贴政策。现在入行，五年后你就是行业老人了。"

  # ============================
  # 薪资成长路径（用于show_fee/异议处理时展示长期价值）
  # ============================
  salary_growth:
    - "薪资这块我跟你透个底：入行第一年，初级岗位月薪9K到15K；一年后跳中级，15K到20K；两年后做高级或者转开发，20K到30K；再往后走架构或者管理，年薪40万起步。这不是画饼——你去看招聘网站，大数据开发、渗透测试这些岗位，薪资就是这个行情。而且每半年涨一次，不是一年等一次调薪。你现在入行，两年后你的同龄人还在原来的岗位上拿死工资，你已经翻倍了。"

  # ============================
  # 信任建设 — 「我们不是培训机构」
  # ============================
  trust_not_training:
    - "我跟你说实话，我们不是培训机构。怎么区分？培训机构收你学费——你交了钱，学不学得会、找不找得到工作，他们不管。我们是猎聘公司——你不就业，我们一分钱不收。我们的钱是企业给的猎聘服务费，不是你给的学费。所以我们的利益跟你绑在一起：你必须就业、薪资达标，我们才能赚钱。这个逻辑你想想就明白了。"

  # ============================
  # 信任建设 — 3天试听机制
  # ============================
  trust_trial_3days:
    - "我们不会一上来就让你签约一个半月。你先来试听3天——不收费，不满意随时走。到第三天有个小考核，主要看你跟不跟得上、适不适合这个方向。通过了再签约继续学，没通过也不勉强。找工作本来就是双向选择，你先来感受一下，自己判断。"

  # ============================
  # 邀约增强 — 限时+名额稀缺（但不虚假承诺）
  # ============================
  invite_scarcity:
    - "这周二新班开课，每期只收30人左右——毕竟不是培训机构，不搞大班。设备电脑都要提前安排，名额满了就只能等下期。你过来直接跟课试听，体验最真实的。定这周吗？不方便的话周末也行，我先帮你留个位置。"

  # ============================
  # 面对「网上有差评」
  # ============================
  objection_negative_reviews:
    - "网上有负面评价我理解，换我刷到也会担心。但你想一个道理——任何一个行业、任何一家公司，网上都有差评。80%写差评的人是根本没来试过的，真正学完就业拿到高薪的，人家忙着上班没空上网炫耀。我们校区公开可参观、可试学，营业执照、办学资质、实训环境全都是透明的。你亲自来看，跟在学的学员聊几句，比看一百条网评都管用。要不要我发你校区实拍和近期就业喜报？"

  # ============================
  # 面对「是不是骗子/套路」
  # ============================
  objection_is_scam:
    - "如果是骗子，我会引导你下载APP转账——我做这种事了没？第二，我们合同上白纸黑字写清楚：不是贷款、不是借贷，就是就业服务费。第三，你不就业，我们一分钱不收——哪个骗子敢这么承诺？每个月300多学员从全国各地过来，如果我们是骗子，早被报警了。你实在不放心，开视频我带你看看我们广州总部，看看真实的上课场景。"

  # ============================
  # 面对「竞品对比」
  # ============================
  objection_competitor:
    - "你对比一下是好事，买东西都要货比三家，何况是职业规划。我建议你重点比三个方面：第一，是不是就业后才收费——有些机构收的是学费，你交了钱学不学得会人家不管；第二，有没有就业保障协议——白纸黑字写清楚薪资底线和就业时限；第三，合作企业有多少——我们光北上广深杭就有300多家合作企业。你把这些对比清楚了，自己心里就有数了。"

  # ============================
  # P1新增：核心商业条款话术（业务要点.txt §五/六/七）
  # ============================

  # 分期顺延规则
  installment_deferral: "如果第3个月你还在学习或推进就业中，分期会自动顺延——等你正式拿到入职offer后，才开始算分期。"

  # 2年再就业保障
  reemployment_guarantee:
    - "我们的保障不只是首份工作——签约后2年内，如果你因为公司裁员、优化等原因离职（不是你自己辞职），拿着公司的离职证明回来，我们免费重新帮你推荐就业，薪资福利标准不变。这是合同里写着的。"

  # 60工作日就业辅导 + 10元/天学杂费
  worst_case_disclosure: "跟你说个底——最坏的情况是什么？如果60个工作日内我们没能帮你就业，就业服务费一分钱不收，你只需要付实训期间的学杂费，10块钱一天。你算算，一个半月也就四五百块钱。这个风险我们替你扛了。"

  # 30天付费宽限期
  payment_grace_period:
    - "如果在保障期内你不幸被裁，分期还没付完的话，可以申请最长30天的付费延期——等你找到新工作、拿到工资后再恢复。这段空窗期的压力我们帮你分担。"

  # 薪资未达标补充
  salary_shortfall_guarantee:
    - "如果推荐岗位的实际薪资没达到我们承诺的最低标准（网安9000/大数据10000），我们会继续帮你推荐，直到薪资达标为止。这个承诺不设时间上限。"

  # 就业城市
  employment_cities:
    - "就业推荐城市覆盖深圳、上海、北京、广州、杭州——都是IT岗位密集的一线城市，五险一金、周末双休是标配。学完后我们根据你的意向城市和企业需求来匹配，不会硬把你塞到不想去的城市。"

  # 餐饮费用披露
  meal_disclosure:
    - "住宿我们全包，吃饭你自己解决哈——校区周边吃饭很方便，一顿十几块钱就能吃好。"

  # 作息制度
  schedule_info:
    - "上课时间是每天上午9点到晚上6点半，中午12点到2点午休。休假是大小周——单周休一天，双周休两天。跟未来上班节奏一致，提前适应。"

  # 报备信息（口语化版本）
  report_info_conversational:
    - "你把名字和电话发我，我帮你登记下，到时候安排住宿也方便。"
    - "你先告诉我你叫什么、电话多少，我这边帮你留着位置。"
    - "名字和手机号发我一下就行，我帮你登记，到时候好安排。"

  # 邀约增强 — 低压力版本
  invite_low_pressure:
    - "你要是有空就过来看看，没空也不急，我先帮你留着位置。"
    - "先来感受一下环境，不一定要马上决定，看看合不合适再说。"
    - "你过来坐坐，跟在学的学员聊聊，自己判断靠不靠谱。"

  # 邀约增强 — 带具体安排
  invite_with_plan:
    - "这周二新班开课，你过来直接跟课试听。我先帮你占个位，定这周二还是周末？"
    - "周末有个开放日，你过来的话我提前帮你安排好，到了直接找我就行。"
    - "你定个时间，我帮你安排好一切——到了直接有人接待，不用你操心。"

  # 文件发送话术
  file_sending:
    - "合同模板我发你了，你先看，有问题随时问我。"
    - "就业数据报告我发你了，上面有薪资和就业去向，你看看。"
    - "校区照片我发你了，你先看看环境。"

  # 岗前考核
  pre_assessment_invite:
    - "你有经验，不用从头学。直接来校区做个技术评估，通过的话走快速内推流程，不用跟零基础的一起上课。这周方便过来吗？"
  pre_assessment_pass:
    - "评估通过了，你的技术水平符合我们的内推标准。接下来把报备信息填一下，我帮你匹配合作企业的在招岗位。"
  pre_assessment_fail:
    - "评估结果出来了，有几个模块还需要加强。你可以选择参加我们的岗前实训（一个半月），专门补这几个模块。当然不强制，你自己决定。"

  # ============================
  # 协议6项保障（用于show_fee/invite阶段的信任巩固）
  # 来源：面试官逐字稿 协议解读
  # ============================
  agreement_guarantees:
    - "协议上的保障我逐条跟你说：第一，保底薪资写进合同——网安不低于9000，大数据不低于10000，低于这个数我们一分钱不收。第二，6个月技术跟踪指导——你上岗后碰到技术卡点，我们有老师帮你解决。第三，2年免费再就业——被裁了、想跳槽了，回来我们重新帮你对接。第四，中途离职暂停收费——把离职证明给我们登记，费用暂停，等你重新入职再继续。第五，退费透明——试听3天内不满意随时走，签约后按实际课时结算。第六，这不是贷款，不影响征信——合同上白纸黑字写清楚。"
