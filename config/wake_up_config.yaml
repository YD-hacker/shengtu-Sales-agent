wake_up:
  enabled: true
  inactive_days: 3
  cron: "0 10 * * *"
  max_total_wakes: null
  min_interval_days_first_phase: 2
  min_interval_days_later_phase: 4
  phase_threshold: 3
  stop_on_failure: true
  stop_on_explicit_reject: false
  reject_weekly_interval: 7
  templates:
    default: "最近怎么样？上次咱们聊到一半，你还有兴趣了解一下吗？"
    icebreak: "好久不见！之前聊的那个事你还在考虑吗？最近有几个新机会，你感兴趣的话我跟你说说。"
    qualify: "上次还没聊完，我这边有几个新的内推岗位，你方便的话把学历和年龄发我，帮你看看合不合适？"
    fee_show: "之前跟你提过的那个实训，最近名额不太够了，你考虑得怎么样了？"
    invite: "之前说好来看看的，这周末正好有开放日，我给你留了位置，你来不来？"
    show_fee: "之前跟你聊的那个费用方案，最近有点变化，你还在考虑吗？"
    report_info: "信息还没发我呢，你把名字和电话发我，我帮你安排。"
    completed: "之前报的信息我都收到了，有什么新问题随时找我。"
